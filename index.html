<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nabore Bookshop · Secure Firebase</title>
    <style>
        /* (same styles as before – omitted for brevity, but use from previous answer) */
        .error-box { background: #ffe5e5; color: #b00020; padding: 16px; border-radius: 24px; margin: 20px; text-align: center; }
        button { background: #4169E1; border: none; border-radius: 40px; padding: 10px 20px; color: white; cursor: pointer; }
    </style>
</head>
<body>
<div id="loginContainer" class="login-container">
    <h2>🔐 Nabore Bookshop</h2>
    <div id="authErrorMsg" class="error-box" style="display:none;"></div>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button id="loginBtn">Sign In</button>
    <button id="signupBtn">Create Account</button>
</div>
<div id="mainContent" style="display:none;"><!-- main app UI here (same as previous) --></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // 🔥 YOUR FIREBASE CONFIG HERE (copy from Console)
  const firebaseConfig = {
  apiKey: "AIzaSyCw3oFnB_jUtSLVSJ3BnyGAG8UHqY7dyQ0",
  authDomain: "nabore-bookshop.firebaseapp.com",
  databaseURL: "https://nabore-bookshop-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nabore-bookshop",
  storageBucket: "nabore-bookshop.firebasestorage.app",
  messagingSenderId: "619207980890",
  appId: "1:619207980890:web:c680907f519b3d6efa2563"
};

    let app, auth, db;
    try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
    } catch(e) {
        document.getElementById('authErrorMsg').innerText = "Firebase config error: " + e.message;
        document.getElementById('authErrorMsg').style.display = "block";
    }

    // Handle auth errors gracefully
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const errorDiv = document.getElementById('authErrorMsg');

    loginBtn.onclick = async () => {
        const email = document.getElementById('loginEmail').value;
        const pwd = document.getElementById('loginPassword').value;
        try {
            await signInWithEmailAndPassword(auth, email, pwd);
        } catch (err) {
            if (err.code === 'auth/configuration-not-found') {
                errorDiv.innerText = "⚠️ Firebase Authentication is not enabled. Go to Firebase Console → Authentication → Enable Email/Password, then refresh.";
            } else {
                errorDiv.innerText = err.message;
            }
            errorDiv.style.display = "block";
        }
    };

    signupBtn.onclick = async () => {
        const email = document.getElementById('loginEmail').value;
        const pwd = document.getElementById('loginPassword').value;
        try {
            await createUserWithEmailAndPassword(auth, email, pwd);
        } catch (err) {
            if (err.code === 'auth/configuration-not-found') {
                errorDiv.innerText = "⚠️ Firebase Authentication is not enabled. Enable Email/Password in Firebase Console first.";
            } else {
                errorDiv.innerText = err.message;
            }
            errorDiv.style.display = "block";
        }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            // The rest of your app logic (charts, sales, etc.) goes here.
            // Use the same code from the previous secure version.
        } else {
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('mainContent').style.display = 'none';
        }
    });
</script>
</body>
</html>
