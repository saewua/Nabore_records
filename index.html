<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Royal POS · Nabore Bookshop (Firebase)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', sans-serif;
        }
        body {
            background: #eef2ff;
            padding: 1rem;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        /* Royal blue theme */
        .royal-bg {
            background: #1e3a8a;
        }
        .royal-text {
            color: #1e3a8a;
        }
        .btn-royal {
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 2rem;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-royal:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        .btn-outline-royal {
            background: transparent;
            border: 1.5px solid #1e3a8a;
            color: #1e3a8a;
            border-radius: 2rem;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-outline-royal:hover {
            background: #dbeafe;
        }
        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }
        .card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: flex-end;
            margin-bottom: 1rem;
        }
        .input-group {
            flex: 1;
            min-width: 120px;
        }
        .input-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: #1e3a8a;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border-radius: 1.5rem;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.7rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background: #f8fafc;
            color: #1e3a8a;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9fafb;
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            margin-bottom: 0.5rem;
        }
        .total {
            text-align: right;
            font-size: 1.3rem;
            font-weight: 800;
            margin-top: 1rem;
            padding-top: 0.5rem;
            border-top: 2px solid #e2e8f0;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e3a8a;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            opacity: 0;
            transition: 0.2s;
            z-index: 1000;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        @media (max-width: 800px) {
            .grid-2col {
                grid-template-columns: 1fr;
            }
        }
        h2, h3 {
            color: #1e3a8a;
            margin-bottom: 0.8rem;
        }
        hr {
            margin: 0.8rem 0;
            border-color: #e2e8f0;
        }
        #loginContainer {
            max-width: 400px;
            margin: 12vh auto;
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 20px 30px rgba(0,0,0,0.1);
        }
    </style>
    <!-- Firebase SDKs -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
            }
        }
    </script>
</head>
<body>
<div id="loginContainer">
    <h2 style="color:#1e3a8a;">📖 Nabore Royal POS</h2>
    <p style="margin: 0.5rem 0 1rem;">Sign in to continue</p>
    <input type="email" id="loginEmail" placeholder="Email" value="admin@bookshop.com" style="width:100%; margin-bottom:0.8rem; padding:0.8rem; border-radius:2rem; border:1px solid #ddd;">
    <input type="password" id="loginPassword" placeholder="Password" value="bookshop123" style="width:100%; margin-bottom:1rem; padding:0.8rem; border-radius:2rem; border:1px solid #ddd;">
    <div style="display:flex; gap:0.8rem; justify-content:center;">
        <button id="loginBtn" class="btn-royal">Sign In</button>
        <button id="signupBtn" class="btn-outline-royal">Create Account</button>
    </div>
    <div id="authErrorMsg" style="color:#b91c1c; font-size:0.8rem; margin-top:1rem;"></div>
</div>

<div id="mainContent" style="display:none;">
<div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h1 style="color: #1e3a8a;">📖 Nabore Bookshop · Royal POS</h1>
        <button id="resetDemoBtn" class="btn-outline-royal">⟳ Reset Demo Data</button>
    </header>

    <div class="grid-2col">
        <!-- LEFT PANEL: POS CART -->
        <div class="card">
            <h2>🧾 New Sale</h2>
            <div class="form-row">
                <div class="input-group">
                    <label>Product / Service</label>
                    <select id="productSelect">
                        <option value="">-- Choose from list --</option>
                    </select>
                    <input type="text" id="customItem" placeholder="Or custom name" style="margin-top: 0.4rem;">
                </div>
                <div class="input-group">
                    <label>Quantity</label>
                    <input type="number" id="qty" value="1" min="1">
                </div>
                <div class="input-group">
                    <label>Price (KES)</label>
                    <input type="number" id="price" step="any" placeholder="Selling price">
                </div>
                <div class="input-group">
                    <button id="addToCartBtn" class="btn-royal">➕ Add</button>
                </div>
            </div>
            <div id="cartList" style="max-height: 320px; overflow-y: auto;"></div>
            <div class="total" id="cartTotal">Total: KES 0.00</div>
            <div class="form-row" style="margin-top: 0.8rem;">
                <div class="input-group">
                    <label>Client (Phone/Name)</label>
                    <input type="text" id="clientName" placeholder="Required">
                </div>
                <div class="input-group">
                    <label>Payment</label>
                    <select id="paymentMethod">
                        <option>Cash</option>
                        <option>M-Pesa</option>
                        <option>Card</option>
                    </select>
                </div>
                <div class="input-group">
                    <button id="completeSaleBtn" class="btn-royal">✅ Complete Sale</button>
                </div>
                <div class="input-group">
                    <button id="clearCartBtn" class="btn-outline-royal">🗑️ Clear Cart</button>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Products Management + Sales History -->
        <div class="card">
            <h2>📦 Manage Products</h2>
            <div class="form-row">
                <div class="input-group">
                    <label>Product Name</label>
                    <input type="text" id="prodName" placeholder="e.g., Notebook">
                </div>
                <div class="input-group">
                    <label>Price (KES)</label>
                    <input type="number" id="prodPrice" step="any" placeholder="Selling price">
                </div>
                <div class="input-group">
                    <label>Type</label>
                    <select id="prodType">
                        <option>Product</option>
                        <option>Service</option>
                    </select>
                </div>
                <div class="input-group">
                    <button id="addProductBtn" class="btn-royal">➕ Add Product</button>
                </div>
            </div>
            <div style="max-height: 200px; overflow-y: auto;">
                <table id="productsTable">
                    <thead>
                        <tr><th>Name</th><th>Type</th><th>Price</th><th>Actions</th>
                    </thead>
                    <tbody id="productsBody"></tbody>
                </table>
            </div>
            <hr>
            <h3>📜 Sales History</h3>
            <div style="max-height: 250px; overflow-y: auto;">
                <table id="historyTable">
                    <thead>
                        <tr><th>Date</th><th>Client</th><th>Items</th><th>Total</th><th>Receipt</th>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
            <button id="exportHistoryBtn" class="btn-outline-royal" style="margin-top: 0.8rem;">📎 Export CSV</button>
        </div>
    </div>
</div>
</div>
<div id="toast" class="toast">✓</div>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, onSnapshot, doc, addDoc, deleteDoc, query, orderBy, setDoc, getDocs, writeBatch } from "firebase/firestore";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "firebase/auth";

 // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCw3oFnB_jUtSLVSJ3BnyGAG8UHqY7dyQ0",
  authDomain: "nabore-bookshop.firebaseapp.com",
  databaseURL: "https://nabore-bookshop-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nabore-bookshop",
  storageBucket: "nabore-bookshop.firebasestorage.app",
  messagingSenderId: "619207980890",
  appId: "1:619207980890:web:c680907f519b3d6efa2563",
  measurementId: "G-YKNGLT2VLT"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // DOM elements
    const loginDiv = document.getElementById('loginContainer');
    const mainDiv = document.getElementById('mainContent');
    const authError = document.getElementById('authErrorMsg');

    // Global data
    let products = [];
    let salesHistory = [];
    let cart = [];

    // Helper functions
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    function formatMoney(amount) {
        return `KES ${(amount || 0).toFixed(2)}`;
    }
    function escapeHtml(str) {
        return String(str).replace(/[&<>]/g, function(m) {
            return m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;';
        });
    }

    // ---------- MIGRATE OLD LOCALSTORAGE DATA TO FIRESTORE ----------
    async function migrateOldData() {
        const storedProducts = localStorage.getItem('royal_pos_products');
        const storedSales = localStorage.getItem('royal_pos_sales');
        let oldProducts = [];
        let oldSales = [];
        if (storedProducts) oldProducts = JSON.parse(storedProducts);
        if (storedSales) oldSales = JSON.parse(storedSales);

        // Check if Firestore already has data (by checking products count)
        const productsSnapshot = await getDocs(collection(db, "products"));
        if (productsSnapshot.empty && oldProducts.length > 0) {
            // migrate products
            for (const prod of oldProducts) {
                await setDoc(doc(db, "products", prod.id || Date.now().toString()), {
                    name: prod.name,
                    price: prod.price,
                    type: prod.type || 'Product',
                    createdAt: new Date()
                });
            }
            showToast(`Migrated ${oldProducts.length} products from local storage`);
        }
        const salesSnapshot = await getDocs(collection(db, "salesHistory"));
        if (salesSnapshot.empty && oldSales.length > 0) {
            for (const sale of oldSales) {
                await addDoc(collection(db, "salesHistory"), {
                    date: sale.date,
                    client: sale.client,
                    items: sale.items,
                    total: sale.total,
                    payment: sale.payment,
                    receiptNo: sale.receiptNo,
                    timestamp: new Date(sale.date).getTime() || Date.now()
                });
            }
            showToast(`Migrated ${oldSales.length} sales records from local storage`);
        }
        // Clear localStorage after migration to avoid duplicate
        if ((oldProducts.length > 0 || oldSales.length > 0) && (productsSnapshot.empty || salesSnapshot.empty)) {
            localStorage.removeItem('royal_pos_products');
            localStorage.removeItem('royal_pos_sales');
        }
    }

    // ---------- FIRESTORE LISTENERS (real-time) ----------
    function setupFirestoreListeners() {
        // Products listener
        onSnapshot(collection(db, "products"), (snap) => {
            products = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderProducts();
            refreshProductSelect();
        });
        // Sales history listener (ordered by timestamp descending)
        const salesQuery = query(collection(db, "salesHistory"), orderBy("timestamp", "desc"));
        onSnapshot(salesQuery, (snap) => {
            salesHistory = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderSalesHistory();
        });
    }

    // Render Products table & dropdown
    function renderProducts() {
        const tbody = document.getElementById('productsBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        products.forEach(prod => {
            const row = tbody.insertRow();
            row.insertCell(0).textContent = prod.name;
            row.insertCell(1).textContent = prod.type || 'Product';
            row.insertCell(2).textContent = formatMoney(prod.price);
            const actionsCell = row.insertCell(3);
            const delBtn = document.createElement('button');
            delBtn.textContent = '🗑️';
            delBtn.className = 'btn-danger';
            delBtn.style.padding = '0.3rem 0.8rem';
            delBtn.style.fontSize = '0.75rem';
            delBtn.onclick = async () => {
                if (confirm(`Delete ${prod.name}?`)) {
                    await deleteDoc(doc(db, "products", prod.id));
                    showToast('Product deleted');
                }
            };
            actionsCell.appendChild(delBtn);
        });
    }

    function refreshProductSelect() {
        const select = document.getElementById('productSelect');
        if (!select) return;
        select.innerHTML = '<option value="">-- Choose from list --</option>';
        products.forEach(prod => {
            const option = document.createElement('option');
            option.value = prod.id;
            option.textContent = `${prod.name} (${prod.type || 'Product'}) - ${formatMoney(prod.price)}`;
            select.appendChild(option);
        });
    }

    // Cart logic
    function renderCart() {
        const container = document.getElementById('cartList');
        if (!container) return;
        if (cart.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:1rem;">🛒 Cart is empty</div>';
            document.getElementById('cartTotal').innerHTML = 'Total: KES 0.00';
            return;
        }
        let html = '';
        let total = 0;
        cart.forEach((item, idx) => {
            total += item.total;
            html += `
                <div class="cart-item">
                    <span><strong>${escapeHtml(item.name)}</strong> x ${item.qty}</span>
                    <span>${formatMoney(item.price)} each</span>
                    <span>${formatMoney(item.total)}</span>
                    <button class="remove-item" data-idx="${idx}" style="background:#dc2626; color:white; border:none; border-radius:2rem; padding:0.2rem 0.8rem; cursor:pointer;">✖️</button>
                </div>
            `;
        });
        container.innerHTML = html;
        document.getElementById('cartTotal').innerHTML = `Total: ${formatMoney(total)}`;
        document.querySelectorAll('.remove-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.idx);
                cart.splice(idx, 1);
                renderCart();
            });
        });
    }

    function addToCart() {
        let name = document.getElementById('customItem').value.trim();
        let price = parseFloat(document.getElementById('price').value);
        const selectedId = document.getElementById('productSelect').value;
        let qty = parseInt(document.getElementById('qty').value);
        if (isNaN(qty) || qty < 1) qty = 1;

        if (selectedId) {
            const product = products.find(p => p.id === selectedId);
            if (product) {
                name = product.name;
                price = product.price;
            }
        }
        if (!name) {
            alert('Please select a product or enter a custom item name');
            return;
        }
        if (isNaN(price) || price <= 0) {
            alert('Please enter a valid price');
            return;
        }
        cart.push({ name, qty, price, total: qty * price });
        renderCart();
        document.getElementById('customItem').value = '';
        document.getElementById('price').value = '';
        document.getElementById('productSelect').value = '';
        document.getElementById('qty').value = '1';
        showToast(`Added ${qty} x ${name}`);
    }

    async function completeSale() {
        if (cart.length === 0) {
            alert('Cart is empty');
            return;
        }
        const client = document.getElementById('clientName').value.trim();
        if (!client) {
            alert('Client name/phone is required');
            return;
        }
        const payment = document.getElementById('paymentMethod').value;
        const total = cart.reduce((sum, i) => sum + i.total, 0);
        const receiptNo = `NB-${Date.now()}`;
        const saleRecord = {
            date: new Date().toLocaleString(),
            client: client,
            items: cart.map(i => ({ name: i.name, qty: i.qty, price: i.price, total: i.total })),
            total: total,
            payment: payment,
            receiptNo: receiptNo,
            timestamp: Date.now()
        };
        try {
            await addDoc(collection(db, "salesHistory"), saleRecord);
            printReceipt(saleRecord);
            cart = [];
            renderCart();
            document.getElementById('clientName').value = '';
            showToast(`Sale completed! Receipt #${receiptNo}`);
        } catch (error) {
            console.error(error);
            alert('Failed to save sale: ' + error.message);
        }
    }

    function printReceipt(sale) {
        const win = window.open('', '_blank');
        let itemsHtml = '';
        sale.items.forEach(item => {
            itemsHtml += `<tr>
                <td>${escapeHtml(item.name)}</td>
                <td>${item.qty}</td>
                <td>${formatMoney(item.price)}</td>
                <td>${formatMoney(item.total)}</td>
            </tr>`;
        });
        win.document.write(`
            <!DOCTYPE html>
            <html>
            <head><title>Receipt ${sale.receiptNo}</title>
            <style>body{font-family:sans-serif;padding:1rem;} table{width:100%;border-collapse:collapse;} td,th{padding:0.5rem;border-bottom:1px solid #ccc;}</style>
            </head>
            <body>
                <h2>📖 Nabore Bookshop</h2>
                <p>Receipt: ${sale.receiptNo}</p>
                <p>Date: ${sale.date}</p>
                <p>Client: ${escapeHtml(sale.client)}</p>
                <p>Payment: ${sale.payment}</p>
                <table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${itemsHtml}</tbody></table>
                <h3>Total: ${formatMoney(sale.total)}</h3>
                <p>Thank you for shopping at Nabore!</p>
                <button onclick="window.print()">Print</button>
            </body>
            </html>
        `);
        win.document.close();
    }

    function renderSalesHistory() {
        const tbody = document.getElementById('historyBody');
        if (!tbody) return;
        if (salesHistory.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5">No sales yet</td></tr>';
            return;
        }
        let html = '';
        salesHistory.forEach(sale => {
            const itemSummary = sale.items.map(i => `${i.name} x${i.qty}`).join(', ');
            html += `
                <tr>
                    <td>${escapeHtml(sale.date)}</td>
                    <td>${escapeHtml(sale.client)}</td>
                    <td>${escapeHtml(itemSummary)}</td>
                    <td>${formatMoney(sale.total)}</td>
                    <td><button class="reprintBtn" data-sale='${JSON.stringify(sale)}' style="background:#1e3a8a; color:white; border:none; border-radius:1rem; padding:0.2rem 0.6rem;">🖨️</button></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
        document.querySelectorAll('.reprintBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                const sale = JSON.parse(btn.dataset.sale);
                printReceipt(sale);
            });
        });
    }

    async function addProduct() {
        const name = document.getElementById('prodName').value.trim();
        const price = parseFloat(document.getElementById('prodPrice').value);
        const type = document.getElementById('prodType').value;
        if (!name) {
            alert('Product name required');
            return;
        }
        if (isNaN(price) || price <= 0) {
            alert('Valid price required');
            return;
        }
        try {
            await addDoc(collection(db, "products"), {
                name: name,
                price: price,
                type: type,
                createdAt: new Date()
            });
            document.getElementById('prodName').value = '';
            document.getElementById('prodPrice').value = '';
            showToast(`Product "${name}" added`);
        } catch (err) {
            alert(err.message);
        }
    }

    async function resetDemoData() {
        if (!confirm('⚠️ This will DELETE all products and sales history in Firestore and reset to demo data. Are you sure?')) return;
        // Delete all existing products and sales
        const productsSnap = await getDocs(collection(db, "products"));
        const batch = writeBatch(db);
        productsSnap.forEach(doc => batch.delete(doc.ref));
        const salesSnap = await getDocs(collection(db, "salesHistory"));
        salesSnap.forEach(doc => batch.delete(doc.ref));
        await batch.commit();

        // Add demo products
        const demoProducts = [
            { name: 'The Great Gatsby', price: 800, type: 'Product' },
            { name: 'Editing Service', price: 1500, type: 'Service' },
            { name: 'Notebook', price: 120, type: 'Product' }
        ];
        for (const prod of demoProducts) {
            await addDoc(collection(db, "products"), { ...prod, createdAt: new Date() });
        }
        // Add demo sale
        await addDoc(collection(db, "salesHistory"), {
            date: new Date().toLocaleString(),
            client: 'Demo Client',
            items: [{ name: 'The Great Gatsby', qty: 1, price: 800, total: 800 }],
            total: 800,
            payment: 'Cash',
            receiptNo: 'DEMO-001',
            timestamp: Date.now()
        });
        showToast('Reset to demo data complete');
    }

    function exportSalesToCSV() {
        if (salesHistory.length === 0) {
            alert('No sales to export');
            return;
        }
        const headers = ['Date', 'Client', 'Items', 'Total (KES)', 'Payment', 'Receipt No'];
        const rows = salesHistory.map(s => [
            s.date,
            s.client,
            s.items.map(i => `${i.name} (${i.qty})`).join('; '),
            s.total.toFixed(2),
            s.payment,
            s.receiptNo
        ]);
        const csvContent = [headers, ...rows].map(row => row.join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `sales_history_${Date.now()}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
        showToast('CSV exported');
    }

    // Auth handlers
    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const pwd = document.getElementById('loginPassword').value;
        try {
            await signInWithEmailAndPassword(auth, email, pwd);
        } catch (err) {
            authError.innerText = err.message;
        }
    }
    async function handleSignup() {
        const email = document.getElementById('loginEmail').value.trim();
        const pwd = document.getElementById('loginPassword').value;
        try {
            await createUserWithEmailAndPassword(auth, email, pwd);
        } catch (err) {
            authError.innerText = err.message;
        }
    }
    document.getElementById('loginBtn').onclick = handleLogin;
    document.getElementById('signupBtn').onclick = handleSignup;
    document.getElementById('logoutMainBtn')?.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            loginDiv.style.display = 'none';
            mainDiv.style.display = 'block';
            // Migrate old data from localStorage (if any)
            await migrateOldData();
            setupFirestoreListeners();
        } else {
            loginDiv.style.display = 'block';
            mainDiv.style.display = 'none';
        }
    });

    // Attach UI event listeners after DOM ready
    document.getElementById('addToCartBtn')?.addEventListener('click', addToCart);
    document.getElementById('completeSaleBtn')?.addEventListener('click', completeSale);
    document.getElementById('clearCartBtn')?.addEventListener('click', () => { cart = []; renderCart(); showToast('Cart cleared'); });
    document.getElementById('addProductBtn')?.addEventListener('click', addProduct);
    document.getElementById('exportHistoryBtn')?.addEventListener('click', exportSalesToCSV);
    document.getElementById('resetDemoBtn')?.addEventListener('click', resetDemoData);
</script>
</body>
</html>
